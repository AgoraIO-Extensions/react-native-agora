name: Setup
description: Setup Node.js and install dependencies

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version-file: .nvmrc

    - name: Setup Ruby
      if: ${{ runner.os == 'macOS' }}
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true

    - name: Setup by gem
      if: ${{ runner.os == 'macOS' }}
      run: |
        # Pin Ruby 2.7-compatible transitive gems to avoid resolver drift on CI.
        gem install 'concurrent-ruby:1.2.2' 'i18n:1.14.1' 'minitest:5.20.0' 'tzinfo:2.0.6' 'activesupport:7.0.8' 'xcodeproj:1.25.1' 'ffi:1.16.3' --no-document
      shell: bash

    - name: Setup Cocoapods
      if: ${{ runner.os == 'macOS' }}
      uses: maxim-lobanov/setup-cocoapods@v1
      with:
        version: 1.16.2

    - name: Install dependencies
      env:
        POD_INSTALL: '0'
      run: yarn install --no-immutable
      shell: bash
