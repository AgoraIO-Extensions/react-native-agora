name: Setup
description: Setup Node.js and install dependencies

inputs:
  workspace:
    description: 'Install only this workspace; empty installs all workspaces'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - name: Setup Ruby
      if: ${{ runner.os == 'macOS' }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Setup by gem
      if: ${{ runner.os == 'macOS' }}
      run: gem install 'activesupport:7.0.8' 'xcodeproj:1.25.1'
      shell: bash

    - name: Setup Cocoapods
      if: ${{ runner.os == 'macOS' }}
      uses: maxim-lobanov/setup-cocoapods@v1
      with:
        version: 1.16.2

    - name: Install dependencies
      env:
        POD_INSTALL: '0'
      run: |
        if [ -n '${{ inputs.workspace }}' ]; then
          yarn workspaces focus '${{ inputs.workspace }}'
        else
          yarn install --immutable
        fi
      shell: bash
