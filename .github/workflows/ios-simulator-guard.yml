name: iOS Simulator Guard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/run-ios-tests.py
      - scripts/test_ios_simulator.py
      - .github/workflows/ci.yml
      - .github/workflows/ios-simulator-guard.yml

permissions:
  contents: read

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p test_ios_simulator.py -v

  simulator-lifecycle:
    needs: logic
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify Simulator readiness and task-owned cleanup
        run: python3 scripts/run-ios-tests.py --probe-only --artifacts "$RUNNER_TEMP/simulator-guard"
      - name: Complete task-owned cleanup
        if: always()
        run: python3 scripts/run-ios-tests.py --cleanup-only --artifacts "$RUNNER_TEMP/simulator-guard"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-guard-diagnostics
          path: ${{ runner.temp }}/simulator-guard/
          if-no-files-found: ignore
          retention-days: 14
