name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - release/*

jobs:
  lint:
    strategy:
      matrix:
        platform: [ubuntu, windows]
    runs-on: ${{ matrix.platform }}-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    strategy:
      matrix:
        platform: [ubuntu, windows]
    runs-on: ${{ matrix.platform }}-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

        with:
          workspace: react-native-agora

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

      - name: Check native test result gates
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s tests -p test_native_ui_runners.py -v

  build-library:
    strategy:
      matrix:
        platform: [ubuntu, windows]
    runs-on: ${{ matrix.platform }}-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

        with:
          workspace: react-native-agora

      - name: Build package
        run: yarn prepare

  test-android:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        newArch: [true, false]
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_newArchEnabled: ${{ matrix.newArch }}
      ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
      GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.workers.max=2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Install JDK
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: '17'
      - name: Configure the test App ID
        env:
          TEST_APP_ID: ${{ secrets.APP_ID }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          p = Path('examples/expo/src/config/agora.config.ts')
          p.write_text(re.sub(r"localAppId = '[^']*'", "localAppId = '" + os.environ['TEST_APP_ID'] + "'", p.read_text()))
          PYTHON
      - name: Build release App and native tests
        working-directory: examples/expo/android
        run: ./gradlew :app:assembleRelease :app:assembleAndroidTest -DtestBuildType=release --no-daemon --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native Android page smoke tests
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          avd-name: emulator
          script: bash scripts/run-android-ui-tests.sh examples/expo "$RUNNER_TEMP/android-tests"
      - name: Upload Android results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tests-${{ matrix.newArch }}
          path: |
            ${{ runner.temp }}/android-tests/
            examples/expo/android/app/build/reports/androidTests/
          if-no-files-found: ignore

  test-ios:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        newArch: [1, 0]
        nativeDependencies: [cocoapods, spm]
    runs-on: macos-15-intel
    env:
      RCT_NEW_ARCH_ENABLED: ${{ matrix.newArch }}
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      RUBYOPT: -rlogger
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Check iOS dependency modes
        run: ruby scripts/test-ios-spm.rb
      - name: Install App dependencies
        run: |
          if [ "${{ matrix.nativeDependencies }}" = "spm" ]; then
            export USE_FRAMEWORKS=dynamic
            export AGORA_SPM_REVISION="${{ github.event.pull_request.head.sha || github.sha }}"
          fi
          yarn pod-install examples/expo/ios
      - name: Check Agora CocoaPods source
        if: ${{ matrix.nativeDependencies == 'cocoapods' }}
        run: |
          ruby -ryaml <<'RUBY'
          lock = YAML.load_file('examples/expo/ios/Podfile.lock')
          agora_pods = lock.fetch('SPEC REPOS').fetch('https://download.agora.io/cocoapods/')
          expected = %w[AgoraRtcEngine_Special_iOS AgoraIrisRTC_iOS]
          abort 'Agora SDKs must resolve from the Agora Specs CDN' unless (expected - agora_pods).empty?
          RUBY
      - name: Configure the test App ID
        env:
          TEST_APP_ID: ${{ secrets.APP_ID }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          p = Path('examples/expo/src/config/agora.config.ts')
          p.write_text(re.sub(r"localAppId = '[^']*'", "localAppId = '" + os.environ['TEST_APP_ID'] + "'", p.read_text()))
          PYTHON
      - name: Build App and native UI test bundle once
        run: |
          mkdir -p "$RUNNER_TEMP/ios-tests"
          ruby scripts/configure-ios-ui-tests.rb examples/expo/ios reactnativeagoraexampleexpo
          xcodebuild -quiet -workspace examples/expo/ios/reactnativeagoraexampleexpo.xcworkspace -scheme AgoraDemoSmokeTests -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ios-derived" build-for-testing CODE_SIGN_IDENTITY=- ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES > "$RUNNER_TEMP/ios-tests/build.log" 2>&1
      - name: Run native iOS page smoke tests
        timeout-minutes: 30
        run: python3 scripts/run-ios-ui-tests.py "$RUNNER_TEMP/ios-derived/Build/Products" "$RUNNER_TEMP/ios-tests" --arch x86_64
      - name: Upload iOS results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-tests-${{ matrix.nativeDependencies }}-${{ matrix.newArch }}
          path: ${{ runner.temp }}/ios-tests/
          if-no-files-found: ignore
