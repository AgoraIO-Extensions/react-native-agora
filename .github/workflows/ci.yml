name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - release/*

jobs:
  lint:
    strategy:
      matrix:
        platform: [ubuntu, windows]
    runs-on: ${{ matrix.platform }}-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    strategy:
      matrix:
        platform: [ubuntu, windows]
    runs-on: ${{ matrix.platform }}-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

      - name: Check iOS test supervision
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p test_ios_simulator.py -v

  build-library:
    strategy:
      matrix:
        platform: [ubuntu, windows]
    runs-on: ${{ matrix.platform }}-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  test-android:
    strategy:
      matrix:
        newArch: [true, false]
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_newArchEnabled: ${{ matrix.newArch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Install Detox dependencies
        shell: bash
        run: |
          npm i -g detox-cli react-native-cli

      - name: Modify APP ID
        run: |
          sed "s/localAppId = '\(.*\)'/localAppId = '${{ secrets.APP_ID }}'/g" agora.config.ts > tmp
          mv tmp agora.config.ts
        working-directory: examples/expo/src/config

      - name: Build example for Android
        run: |
          yarn example detox:android

      - name: Clean Useless cache
        run: |
          rm -rf ~/.gradle/caches || true
          rm -rf ~/.gradle/wrapper || true
          sudo apt-get clean
          npm cache clean --force
          rm -rf examples/**/ios
          yarn cache clean
          df -h

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run e2e tests
        # https://github.com/wix/Detox/issues/3720#issuecomment-1347855162
        if: ${{ matrix.newArch == false }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          avd-name: emulator
          working-directory: examples/expo
          script: detox test -c android.emu.release

  test-ios:
    strategy:
      fail-fast: false
      matrix:
        newArch: [1, 0]
        nativeDependencies: [cocoapods, spm]
    runs-on: macos-15-intel
    env:
      RCT_NEW_ARCH_ENABLED: ${{ matrix.newArch }}
      RUBYOPT: -rlogger
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup
        env:
          DETOX_DISABLE_POSTINSTALL: '1'

      - name: Check iOS dependency modes
        run: ruby scripts/test-ios-spm.rb

      - name: Install cocoapods
        run: |
          if [ "${{ matrix.nativeDependencies }}" = "spm" ]; then
            export USE_FRAMEWORKS=dynamic
            export AGORA_SPM_REVISION="${{ github.event.pull_request.head.sha || github.sha }}"
          fi
          yarn pod-install examples/expo/ios

      - name: Check Agora CocoaPods source
        if: ${{ matrix.nativeDependencies == 'cocoapods' }}
        run: |
          ruby -ryaml <<'RUBY'
          lock = YAML.load_file('examples/expo/ios/Podfile.lock')
          agora_pods = lock.fetch('SPEC REPOS').fetch('https://download.agora.io/cocoapods/')
          expected = %w[AgoraRtcEngine_Special_iOS AgoraIrisRTC_iOS]
          abort 'Agora SDKs must resolve from the Agora Specs CDN' unless (expected - agora_pods).empty?
          RUBY

      - name: Prepare Detox iOS dependencies once
        shell: bash
        working-directory: examples/expo
        run: |
          node node_modules/detox/scripts/postinstall.js
          brew tap wix/brew
          brew trust --formula wix/brew/applesimutils
          brew install applesimutils

      - name: Modify APP ID
        run: |
          sed "s/localAppId = '\(.*\)'/localAppId = '${{ secrets.APP_ID }}'/g" agora.config.ts > tmp
          mv tmp agora.config.ts
        working-directory: examples/expo/src/config

      - name: Build example for iOS
        run: |
          yarn example detox:ios

      - name: Run iOS tests with bounded Simulator recovery
        if: ${{ matrix.newArch == 0 }}
        timeout-minutes: 40
        env:
          AGORA_TEST_APP_ID: ${{ secrets.APP_ID }}
        run: |
          python3 scripts/run-ios-tests.py --app-dir examples/expo --artifacts "$RUNNER_TEMP/ios-test-results"

      - name: Clean up task-owned Simulators
        if: always() && matrix.newArch == 0
        timeout-minutes: 3
        run: python3 scripts/run-ios-tests.py --artifacts "$RUNNER_TEMP/ios-test-results" --cleanup-only

      - name: Upload iOS test diagnostics
        if: always() && matrix.newArch == 0
        uses: actions/upload-artifact@v4
        with:
          name: ios-tests-${{ matrix.newArch }}-${{ matrix.nativeDependencies }}
          path: ${{ runner.temp }}/ios-test-results/
          if-no-files-found: ignore
          retention-days: 14
