name: PR990 Customer Acceptance

on:
  workflow_dispatch:
    inputs:
      sdk_source:
        description: 'Full SDK commit SHA to package and test'
        type: string
        default: c1e267a21b6c634d61b368e8484a9de14a92d8b5
      scenario:
        type: choice
        default: all
        options:
          [
            all,
            spm-new,
            host-control,
            upgrade,
            launch-study,
            launch-followup,
            launch-permissions,
            launch-rtc,
            native-smoke,
            native-matrix,
          ]

permissions:
  contents: read
  actions: read

concurrency:
  group: pr990-customer-acceptance-${{ github.ref }}-${{ inputs.scenario || 'all' }}
  cancel-in-progress: false

env:
  SDK_SOURCE_REF: ${{ inputs.sdk_source || 'c1e267a21b6c634d61b368e8484a9de14a92d8b5' }}

jobs:
  native-xctest:
    if: inputs.scenario == 'native-smoke' || inputs.scenario == 'native-matrix'
    needs: package-sdk
    runs-on: macos-15
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.scenario == 'native-smoke' && '[{"mode":"spm","newArch":1}]' || '[{"mode":"cocoapods","newArch":0},{"mode":"cocoapods","newArch":1},{"mode":"spm","newArch":0},{"mode":"spm","newArch":1}]') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      RCT_NEW_ARCH_ENABLED: ${{ matrix.newArch }}
      RUBYOPT: -rlogger
      # Offline lifecycle checks use a synthetic identifier; they do not join RTC.
      AGORA_APP_ID: '0123456789abcdef0123456789abcdef'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install cocoapods -v 1.16.2 --no-document
      - uses: actions/download-artifact@v4
        with:
          name: pr990-sdk-package
          path: ${{ runner.temp }}/sdk-package
      - name: Verify the freshly built SDK package
        run: |
          mkdir -p "$RUNNER_TEMP/native-evidence"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          package = Path(os.environ['RUNNER_TEMP']) / 'sdk-package'
          source = (package / 'source-commit.txt').read_text().strip()
          assert source == os.environ['SDK_SOURCE_REF']
          archive, = package.glob('*.tgz')
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert digest == (package / 'package-sha256.txt').read_text().split()[0]
          declaration_config = json.loads((package / 'declaration-build-config.json').read_text())
          evidence = {'packageSource': source, 'currentPRSource': os.environ['SDK_SOURCE_REF'],
                      'sourceTree': (package / 'source-tree.txt').read_text().strip(), 'packageSHA256': digest,
                      'declarationBuildExcludes': declaration_config['exclude']}
          (Path(os.environ['RUNNER_TEMP']) / 'native-evidence/package.json').write_text(json.dumps(evidence, indent=2))
          PY
      - name: Create a standalone customer App and hosted XCTest target
        run: |
          node scripts/customer-acceptance/prepare.cjs "$RUNNER_TEMP/AgoraCustomer" "$RUNNER_TEMP/sdk-package/"*.tgz '${{ matrix.mode }}' > "$RUNNER_TEMP/native-evidence/npm-install.log" 2>&1
          ruby scripts/customer-acceptance/configure-xctest.rb "$RUNNER_TEMP/AgoraCustomer" '${{ matrix.newArch }}'
      - name: Install customer dependencies through the README path
        run: |
          if [ '${{ matrix.mode }}' = spm ]; then
            export USE_FRAMEWORKS=dynamic
            export AGORA_SPM_REVISION="$SDK_SOURCE_REF"
          fi
          cd "$RUNNER_TEMP/AgoraCustomer/ios"
          pod install --repo-update > "$RUNNER_TEMP/native-evidence/pod-install.log" 2>&1
          cp Podfile.lock "$RUNNER_TEMP/native-evidence/"
      - name: Audit native dependency linkage
        run: ruby scripts/customer-acceptance/audit.rb '${{ matrix.mode }}' "$RUNNER_TEMP/AgoraCustomer" "$RUNNER_TEMP/native-evidence"
      - name: Build the hosted native test bundle once
        working-directory: ${{ runner.temp }}/AgoraCustomer/ios
        run: |
          xcodebuild -quiet -workspace AgoraCustomer.xcworkspace -scheme AgoraCustomerTests -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/native-derived" build-for-testing CODE_SIGN_IDENTITY=- ARCHS=arm64 ONLY_ACTIVE_ARCH=YES > "$RUNNER_TEMP/native-evidence/build.log" 2>&1
      - name: Preserve the exact compiled App and test bundle
        run: |
          cp "$RUNNER_TEMP/native-derived/Build/Products/"*.xctestrun "$RUNNER_TEMP/native-evidence/"
          cp "$RUNNER_TEMP/native-evidence/package.json" "$RUNNER_TEMP/native-derived/Build/Products/sdk-package.json"
          tar -czf "$RUNNER_TEMP/native-test-products.tgz" -C "$RUNNER_TEMP/native-derived/Build" Products
          shasum -a 256 "$RUNNER_TEMP/native-test-products.tgz" > "$RUNNER_TEMP/native-test-products.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: native-test-products-${{ matrix.mode }}-arch${{ matrix.newArch }}
          path: |
            ${{ runner.temp }}/native-test-products.tgz
            ${{ runner.temp }}/native-test-products.sha256
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Run the real RN bridge lifecycle through XCTest
        timeout-minutes: 20
        run: python3 -u scripts/customer-acceptance/run-xctest.py "$RUNNER_TEMP/native-derived/Build/Products" "$RUNNER_TEMP/native-evidence" --negative-control
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-xctest-${{ matrix.mode }}-arch${{ matrix.newArch }}
          path: ${{ runner.temp }}/native-evidence/
          if-no-files-found: error

  package-sdk:
    if: inputs.scenario != 'host-control'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SDK_SOURCE_REF }}
          path: sdk
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the exact PR npm package
        working-directory: sdk
        env:
          POD_INSTALL: '0'
          LEFTHOOK: '0'
          DETOX_DISABLE_POSTINSTALL: '1'
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'true'
        run: |
          corepack enable
          yarn workspaces focus react-native-agora
          yarn test --runInBand
          # Unit tests run above. Library declarations must not import Demo types through tests.
          node - <<'JS'
          const fs = require('node:fs');
          const file = 'tsconfig.build.json';
          const config = JSON.parse(fs.readFileSync(file, 'utf8'));
          config.exclude = [...new Set([...(config.exclude || []), 'src/__tests__'])];
          fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n');
          JS
          yarn prepare
          git diff --exit-code -- src ios Package.swift react-native-agora.podspec package.json
          mkdir -p "$RUNNER_TEMP/sdk-package"
          cp tsconfig.build.json "$RUNNER_TEMP/sdk-package/declaration-build-config.json"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/sdk-package"
          git rev-parse HEAD > "$RUNNER_TEMP/sdk-package/source-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/sdk-package/source-tree.txt"
          sha256sum "$RUNNER_TEMP/sdk-package/"*.tgz > "$RUNNER_TEMP/sdk-package/package-sha256.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: pr990-sdk-package
          path: ${{ runner.temp }}/sdk-package/
          if-no-files-found: error

  simulator-control:
    if: inputs.scenario == 'host-control'
    runs-on: macos-15
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        runtime: ['18-5', '18-6']
    steps:
      - name: Launch the system Settings app without RN or Agora
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          python3 -u - <<'PY'
          import subprocess
          def sim(*args, timeout=180):
              print('simctl ' + ' '.join(args), flush=True)
              result = subprocess.run(['xcrun','simctl',*args], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=timeout)
              print(result.stdout, flush=True)
              result.check_returncode()
              return result.stdout.strip()
          device = sim('create','Agora-Host-Control','com.apple.CoreSimulator.SimDeviceType.iPhone-16','com.apple.CoreSimulator.SimRuntime.iOS-${{ matrix.runtime }}')
          try:
              sim('boot',device)
              sim('bootstatus',device,'-b',timeout=300)
              sim('launch',device,'com.apple.Preferences')
              print('HOST_CONTROL_SETTINGS_LAUNCH_PASSED', flush=True)
          finally:
              for action in ['shutdown','delete']:
                  try: sim(action,device,timeout=20)
                  except Exception as error: print(type(error).__name__, flush=True)
          PY

  customer-ios:
    if: inputs.scenario == 'all' || inputs.scenario == 'spm-new'
    needs: package-sdk
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.scenario == 'spm-new' && '[{"mode":"spm","newArch":1}]' || '[{"mode":"cocoapods","newArch":0},{"mode":"cocoapods","newArch":1},{"mode":"spm","newArch":0},{"mode":"spm","newArch":1}]') }}
    env:
      RCT_NEW_ARCH_ENABLED: ${{ matrix.newArch }}
      RUBYOPT: -rlogger
      AGORA_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install cocoapods -v 1.16.2 --no-document
      - uses: actions/download-artifact@v4
        with:
          name: pr990-sdk-package
          path: ${{ runner.temp }}/sdk-package
      - name: Verify simulator hosts before installing the SDK
        timeout-minutes: 12
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          echo "CP_HOME_DIR=$RUNNER_TEMP/customer-cocoapods" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/customer-evidence"
          python3 scripts/customer-acceptance/runtime.py "$RUNNER_TEMP/AgoraCustomer" "$RUNNER_TEMP/customer-evidence" --arch '${{ matrix.newArch }}' --mode '${{ matrix.mode }}' --prepare-only
      - name: Create fresh customer app
        run: |
          node scripts/customer-acceptance/prepare.cjs "$RUNNER_TEMP/AgoraCustomer" "$RUNNER_TEMP/sdk-package/"*.tgz '${{ matrix.mode }}' > "$RUNNER_TEMP/customer-evidence/npm-install.log" 2>&1
          cp "$RUNNER_TEMP/AgoraCustomer/package.json" "$RUNNER_TEMP/AgoraCustomer/package-lock.json" "$RUNNER_TEMP/customer-evidence/"
          cp "$RUNNER_TEMP/AgoraCustomer/ios/Podfile" "$RUNNER_TEMP/customer-evidence/"
      - name: Follow README pod installation
        run: |
          if [ '${{ matrix.mode }}' = spm ]; then
            export USE_FRAMEWORKS=dynamic
            export AGORA_SPM_REVISION="$SDK_SOURCE_REF"
          fi
          cd "$RUNNER_TEMP/AgoraCustomer/ios"
          pod install --repo-update > "$RUNNER_TEMP/customer-evidence/pod-install.log" 2>&1
          cp Podfile.lock "$RUNNER_TEMP/customer-evidence/"
      - name: Audit the dependency path
        run: ruby scripts/customer-acceptance/audit.rb '${{ matrix.mode }}' "$RUNNER_TEMP/AgoraCustomer" "$RUNNER_TEMP/customer-evidence"
      - name: Clean Release build
        run: |
          cd "$RUNNER_TEMP/AgoraCustomer/ios"
          xcodebuild -workspace AgoraCustomer.xcworkspace -scheme AgoraCustomer -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/customer-derived" build CODE_SIGN_IDENTITY=- ARCHS=arm64 ONLY_ACTIVE_ARCH=YES > "$RUNNER_TEMP/customer-evidence/simulator-build.log" 2>&1
          codesign --verify --deep --strict "$RUNNER_TEMP/customer-derived/Build/Products/Release-iphonesimulator/AgoraCustomer.app" > "$RUNNER_TEMP/customer-evidence/simulator-signing.log" 2>&1
      - name: Verify unsigned device Archive
        if: ${{ matrix.newArch == 1 }}
        run: |
          cd "$RUNNER_TEMP/AgoraCustomer/ios"
          xcodebuild -workspace AgoraCustomer.xcworkspace -scheme AgoraCustomer -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/customer-device-derived" -archivePath "$RUNNER_TEMP/AgoraCustomer.xcarchive" archive CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/customer-evidence/device-archive.log" 2>&1
          test -d "$RUNNER_TEMP/AgoraCustomer.xcarchive/Products/Applications/AgoraCustomer.app/Frameworks/AgoraRtcWrapper.framework"
          find "$RUNNER_TEMP/AgoraCustomer.xcarchive/Products/Applications/AgoraCustomer.app/Frameworks" -maxdepth 1 -name '*.framework' -print > "$RUNNER_TEMP/customer-evidence/archive-frameworks.txt"
      - name: Launch two customer clients and verify SDK / real video / release
        timeout-minutes: 20
        run: |
          python3 scripts/customer-acceptance/runtime.py "$RUNNER_TEMP/customer-derived/Build/Products/Release-iphonesimulator/AgoraCustomer.app" "$RUNNER_TEMP/customer-evidence" --arch '${{ matrix.newArch }}' --mode '${{ matrix.mode }}'
      - name: Clean up task-owned simulators
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          file = Path(os.environ['RUNNER_TEMP']) / 'customer-evidence' / 'simulators.json'
          if file.exists():
              for device in json.loads(file.read_text()).values():
                  for action in ['shutdown', 'delete']:
                      try:
                          subprocess.run(['xcrun', 'simctl', action, device], timeout=20, check=False)
                      except subprocess.TimeoutExpired:
                          print(f'Simulator {action} timed out; hosted runner teardown will reclaim it.')
          PY
      - name: Redact the test project identifier in diagnostic logs
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'customer-evidence'
          secret = os.environ.get('AGORA_APP_ID', '')
          if secret:
              for file in root.rglob('*'):
                  if file.is_file() and file.suffix in {'.log', '.json', '.txt'}:
                      file.write_text(file.read_text(errors='replace').replace(secret, '[APP_ID]'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-${{ matrix.mode }}-arch${{ matrix.newArch }}
          path: ${{ runner.temp }}/customer-evidence/
          if-no-files-found: error

  customer-upgrade:
    if: inputs.scenario == 'upgrade'
    needs: package-sdk
    runs-on: macos-15
    timeout-minutes: 45
    env:
      RCT_NEW_ARCH_ENABLED: '0'
      RUBYOPT: -rlogger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install cocoapods -v 1.16.2 --no-document
      - uses: actions/download-artifact@v4
        with:
          name: pr990-sdk-package
          path: ${{ runner.temp }}/sdk-package
      - name: Upgrade the real published SDK using the README command
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          python3 -u scripts/customer-acceptance/upgrade.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-upgrade
          path: ${{ runner.temp }}/upgrade-evidence/
          if-no-files-found: error

  launch-study:
    if: inputs.scenario == 'launch-study' || inputs.scenario == 'launch-followup' || inputs.scenario == 'launch-permissions' || inputs.scenario == 'launch-rtc'
    needs: package-sdk
    runs-on: macos-15
    timeout-minutes: 75
    env:
      RUBYOPT: -rlogger
      AGORA_APP_ID: ${{ secrets.APP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install cocoapods -v 1.16.2 --no-document
      - uses: actions/download-artifact@v4
        with:
          name: pr990-sdk-package
          path: ${{ runner.temp }}/sdk-package
      - name: Compare RN control, SPM linkage, and SDK initialization
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          python3 -u scripts/customer-acceptance/launch-study.py ${{ inputs.scenario == 'launch-followup' && '--followup' || inputs.scenario == 'launch-permissions' && '--permissions' || inputs.scenario == 'launch-rtc' && '--rtc' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-study
          path: ${{ runner.temp }}/launch-study/
          if-no-files-found: error
