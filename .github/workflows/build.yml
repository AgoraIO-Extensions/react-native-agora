name: PR 988 RN 0.60 compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rn060:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      RUBYOPT: -rlogger
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '16.20.2'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install CocoaPods
        run: gem install cocoapods -v 1.16.2 --no-document
      - name: Fetch reviewed PR revision
        run: |
          git fetch origin refs/pull/988/head:refs/remotes/origin/pr-988-compat
          test "$(git rev-parse refs/remotes/origin/pr-988-compat)" = cd6020ac3d63067f2b4d135335768be4e5215e69
      - name: Build minimum supported RN before and after PR
        run: python3 scripts/compat-pr988-rn060.py "$RUNNER_TEMP/rn060"
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rn060-before-after-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rn060/report/
          if-no-files-found: error
